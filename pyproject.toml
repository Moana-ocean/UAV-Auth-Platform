[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-auth-eval"
version = "0.1.0"
description = "Local Chapter 5 evaluation platform: X.509 vs permissioned-blockchain UAV-to-GCS authentication"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MSc Information Security dissertation experiment" }]
dependencies = [
    "cryptography==44.0.2",
    "web3==7.12.0",
    "eth-account==0.13.7",
    "py-solc-x==2.0.4",
    "streamlit==1.48.0",
    "pandas==2.2.3",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "psutil==7.0.0",
    "matplotlib==3.10.3",
    "plotly==6.2.0",
    "python-dotenv==1.1.1",
    "click==8.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.8",
    "black==25.1.0",
]

[project.scripts]
uav-auth = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires local Besu Docker network",
    "slow: longer-running experiment tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
